AWSTemplateFormatVersion: "2010-09-09"
Description: DynamoDB table for PR metrics aggregation

Parameters:
  TableName:
    Type: String
    Default: pr-metrics
    Description: Name of the DynamoDB table

Resources:
  PRMetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: team
          AttributeType: S
        - AttributeName: author
          AttributeType: S
        - AttributeName: dateOpened
          AttributeType: S
        - AttributeName: allPrs
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi-team-date
          KeySchema:
            - AttributeName: team
              KeyType: HASH
            - AttributeName: dateOpened
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi-author-date
          KeySchema:
            - AttributeName: author
              KeyType: HASH
            - AttributeName: dateOpened
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi-all-date
          KeySchema:
            - AttributeName: allPrs
              KeyType: HASH
            - AttributeName: dateOpened
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

Outputs:
  TableName:
    Value: !Ref PRMetricsTable
  TableArn:
    Value: !GetAtt PRMetricsTable.Arn
